# ============================================================
# Dograh — AI Voice Calling Agent Stack
# docker-compose.yaml
#
# Start with:
#   docker compose up -d
# Access at:
#   http://localhost:3010
# ============================================================

services:

  # ── PostgreSQL + pgvector ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dograh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dograh
      POSTGRES_USER: dograh
      POSTGRES_PASSWORD: dograh_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dograh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dograh_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage) ──────────────────────────
  minio:
    image: minio/minio:latest
    container_name: dograh_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dograh_minio
      MINIO_ROOT_PASSWORD: dograh_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dograh API ──────────────────────────────────────────────
  dograh-api:
    image: ghcr.io/dograh-hq/dograh-api:latest
    container_name: dograh_api
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8000"
    environment:
      # ── Database ──
      DATABASE_URL: postgresql+asyncpg://dograh:dograh_secret@postgres:5432/dograh

      # ── Redis ──
      REDIS_URL: redis://redis:6379

      # ── MinIO / S3 ──
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: dograh_minio
      S3_SECRET_KEY: dograh_minio_secret
      S3_BUCKET: dograh
      S3_REGION: us-east-1

      # ── Application ──
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      ENVIRONMENT: production

      # ── Secret (change this!) ──
      SECRET_KEY: a6d0181136f1dc747cbd56f7c9c21acd7553530d451c657e2e86734bd51a9c5d

      # ── Public URL (used for webhooks & SIP callbacks) ──
      # IMPORTANT: Set this to your Cloudflare tunnel URL (or LAN IP) so
      # external services can reach the API. The env var name MUST be
      # PUBLIC_BASE_URL — not PUBLIC_URL — which is what the API code reads.
      # Example: http://192.168.1.10:8080
      PUBLIC_BASE_URL: https://delegation-off-bases-lovers.trycloudflare.com

      # ── LLM — Groq ──
      # Set via environment or .env file
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # ── STT — Local Qwen3-ASR server ──
      # host.docker.internal resolves to the Windows host from inside Docker
      CUSTOM_STT_BASE_URL: http://host.docker.internal:8001/v1
      CUSTOM_STT_API_KEY: local
      CUSTOM_STT_MODEL: Qwen/Qwen3-ASR-1.7B

      # ── TTS — Local CosyVoice3 server ──
      CUSTOM_TTS_BASE_URL: http://host.docker.internal:8002/v1
      CUSTOM_TTS_API_KEY: local
      CUSTOM_TTS_MODEL: FunAudioLLM/Fun-CosyVoice3-0.5B-2512

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Dograh Dashboard (frontend) ────────────────────────────
  dograh-dashboard:
    image: ghcr.io/dograh-hq/dograh-ui:latest
    container_name: dograh_dashboard
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - dograh-api
    ports:
      - "3010:3010"
    environment:
      # The dashboard calls the API through the browser, so use localhost
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # WebSocket connections must go directly to the API port (8080) —
      # Next.js does not proxy WebSocket upgrades, so ws://localhost:3010
      # would fail. Point the browser directly at the API server.
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      BACKEND_URL: http://dograh-api:8000
      NODE_ENV: "oss"
      PORT: "3010"

  # ── Dograh Worker (background jobs) ────────────────────────
  dograh-worker:
    image: ghcr.io/dograh-hq/dograh-api:latest
    container_name: dograh_worker
    restart: unless-stopped
    pull_policy: always
    command: ["python", "-m", "arq", "api.tasks.arq.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dograh:dograh_secret@postgres:5432/dograh
      REDIS_URL: redis://redis:6379
      SECRET_KEY: a6d0181136f1dc747cbd56f7c9c21acd7553530d451c657e2e86734bd51a9c5d
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  minio_data:
